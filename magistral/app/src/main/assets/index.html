<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>Магистраль</title>
</head><body>
<style>
/* Layout: one-screen game. 3D hub or map fills the screen, resource bar on top, tab bar at the bottom, sheets slide up over it */
:root{
  --ink:#2a2018; --muted:#7b6a55; --cream:#fff8e8; --cream2:#f7e9c9; --line:#e6d1a7;
  --red:#d9412b; --red-d:#a8301e; --green:#4fa83a; --green-d:#357a25; --gold:#ffc23d; --gold-d:#c98d0a;
  --blue:#2f7fbf; --blue-d:#1f5b8f; --sea:#8fd0ec; --land:#f3e5bd; --shore:#c9ad78; --river:#7cc4e6;
  --display:"Russo One",system-ui,sans-serif; --body:"Rubik",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;background:#9fdcf5;color:var(--ink);font-family:var(--body)}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{cursor:default}
#hub,#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#map{background:var(--sea)}
#hub[hidden],#map[hidden]{display:none}

/* top bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:6px;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.chip{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--cream);border:2px solid var(--line);border-radius:12px;
  padding:4px 9px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(60,40,10,.15);white-space:nowrap}
.chip.neg{color:var(--red)}
.chip small{font-weight:500;color:var(--muted);font-size:12px}
.sp{flex:1}
.sites{pointer-events:auto;flex-basis:100%;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.sites::-webkit-scrollbar{display:none}
.sites button{flex:none;background:var(--cream);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;box-shadow:0 3px 0 rgba(60,40,10,.15)}
.sites button.on{background:var(--blue);border-color:var(--blue-d);color:#fff;box-shadow:0 3px 0 var(--blue-d)}
.sites[hidden]{display:none}
.coin{width:17px;height:17px;flex:none;border-radius:50%;background:var(--gold);border:2px solid var(--gold-d);display:grid;place-items:center;font-size:9px;font-weight:800;color:#7a5200;line-height:1}
.val{width:16px;height:15px;flex:none;background:linear-gradient(90deg,var(--blue) 0 28%,transparent 28% 36%,var(--blue) 36% 64%,transparent 64% 72%,var(--blue) 72%);clip-path:polygon(0 60%,28% 60%,28% 35%,64% 35%,64% 0,100% 0,100% 100%,0 100%)}
.goalbar{height:10px;background:var(--cream2);border-radius:5px;overflow:hidden}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:5px}
.tag.compact .n{display:none}
.pbar{display:block;width:64px;height:5px;background:var(--cream2);border-radius:3px;overflow:hidden;margin-top:3px}.pbar b{display:block;height:100%;background:var(--green)}
.bub.timer{flex-direction:column;align-items:stretch}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.inp{width:100%;box-sizing:border-box;font:inherit;font-size:16px;font-weight:700;padding:11px 13px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--blue)}
.prev{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.prev .bodyc{flex:1;height:34px;border-radius:17px 8px 8px 17px;background:#eef0f2;position:relative;overflow:hidden;display:flex;align-items:center;padding-left:14px;font-weight:800;font-size:14px}
.prev .bodyc i{position:absolute;left:0;right:0;bottom:3px;height:4px}
#win{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(40,25,10,.55);padding:20px}
#win .card{background:var(--cream);border-radius:22px;padding:24px 20px;max-width:360px;text-align:center;display:flex;flex-direction:column;gap:10px}
#win h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px}
#win p{margin:0;line-height:1.45}
.hammer{width:14px;height:14px;flex:none;border-radius:3px;background:var(--muted)}
.hammer.on{background:var(--gold-d);animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(.75)}}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:8px;justify-content:center;
  padding-top:8px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));pointer-events:none}
.nav button{pointer-events:auto;flex:1;max-width:140px;background:var(--cream);border:2px solid var(--line);border-radius:14px;padding:9px 6px;
  font-family:var(--display);font-size:13px;box-shadow:0 4px 0 rgba(60,40,10,.18)}
.nav button.on{background:var(--red);border-color:var(--red-d);color:#fff;box-shadow:0 4px 0 var(--red-d)}
.nav button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(60,40,10,.18)}

/* hub overlays */
#tags{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:3px}
.tag .nm{background:rgba(255,248,232,.92);border:1.5px solid var(--line);border-radius:9px;padding:2px 7px;font-size:11.5px;font-weight:700;white-space:nowrap;display:flex;gap:5px;align-items:center}
.tag .lv{background:var(--blue);color:#fff;border-radius:6px;padding:0 5px;font-size:10.5px;font-weight:800}
.tag .lv.zero{background:var(--muted)}
.bub{display:flex;align-items:center;gap:4px;background:var(--gold);border:2px solid var(--gold-d);border-radius:999px;padding:3px 9px 3px 4px;font-weight:800;font-size:12.5px;
  box-shadow:0 3px 0 var(--gold-d);animation:bob 1.2s ease-in-out infinite alternate;font-variant-numeric:tabular-nums}
.bub.full{background:#ffdf8a;border-color:var(--red);box-shadow:0 3px 0 var(--red)}
.bub.timer{background:var(--cream);border-color:var(--line);box-shadow:0 3px 0 rgba(60,40,10,.18);padding:3px 9px;animation:none}
@keyframes bob{to{transform:translateY(-4px)}}

/* sheet */
#backdrop{position:fixed;inset:0;z-index:19;background:rgba(40,25,10,.18)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:74%;overflow-y:auto;background:var(--cream);border-top:3px solid var(--line);
  border-radius:22px 22px 0 0;box-shadow:0 -8px 24px rgba(40,25,10,.18);
  padding-top:16px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .sx{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:50%;background:var(--cream2);font-size:20px;line-height:1;font-weight:700;z-index:1}
#sheetBody{display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto}
.sh-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-right:40px}
.sh-h h2{margin:0;font-family:var(--display);font-weight:400;font-size:21px;line-height:1.15;text-wrap:balance}
.pill{background:var(--blue);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800}
.pill.grey{background:var(--muted)}
.sub{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.rows{display:flex;flex-direction:column;background:#fff;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;font-size:14px;border-top:1px solid var(--cream2)}
.row:first-child{border-top:0}
.row span{color:var(--muted)}
.row b{text-align:right;font-variant-numeric:tabular-nums}
.sec{font-family:var(--display);font-size:14px;margin:6px 0 0;letter-spacing:.02em}
.note{background:var(--cream2);border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.4}
.note.warn{background:#fde3dc;color:var(--red-d)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:13px;padding:10px 14px;font-weight:800;font-size:14.5px;
  background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-d)}
.btn.gold{background:var(--gold);color:#4a3200;box-shadow:0 4px 0 var(--gold-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.ghost{background:var(--cream2);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn:disabled{background:#d9cfbd;color:#8b7d68;box-shadow:0 4px 0 #bfb29b;transform:none}
.btn.w{width:100%}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-size:14.5px}
.opt .t small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.opt .pos{color:var(--green-d);font-weight:800}
.opt .ng{color:var(--red);font-weight:800}
.opt.locked{opacity:.55}
.seg{display:flex;background:var(--cream2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border-radius:9px;padding:7px 4px;font-size:13px;font-weight:700}
.seg button.on{background:#fff;box-shadow:0 2px 0 var(--line)}
.bar2{height:6px;background:var(--cream2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar2 i{display:block;height:100%;background:var(--blue);border-radius:3px}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 140px);z-index:40;transform:translate(-50%,-8px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--cream);font-weight:700;font-size:14px;padding:9px 15px;border-radius:13px;max-width:calc(100% - 32px);text-align:center;
  transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* map svg */
.ct text{font-family:var(--body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--cream);stroke-width:3px;stroke-linejoin:round;display:none}
.ct .show text,.ct.zoomed text{display:block}
.ct text.hid{display:none!important}
.ct .dot{fill:#fff;stroke:var(--ink);stroke-width:1.5px}
.ct .reach .dot{fill:var(--gold)}
.ct .dim .dot{fill:#d8ccb4;stroke:#a89878}
.ct .dim text{fill:#8b7d68}
.ct .route .dot{fill:var(--green)}
.ct .sel .dot{fill:var(--red)}
.livs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}.livs button{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:12px;border:2px solid transparent;background:var(--card2,#f4ecdc);font:600 13px Rubik,Arial,sans-serif;color:inherit;text-align:left}.livs button.on{border-color:var(--red)}.livs i{width:14px;height:14px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.ct .evc{fill:#f08a24;stroke:#fff;stroke-width:1.5px}
.qi{width:12px;height:12px;border-radius:50%;border:3px solid #2a7fd1;box-sizing:border-box;flex:none}#cQ.hot{background:#ffe08a}#cQ.hot .qi{border-color:#d6402b}#vQ:empty{display:none}
#mg{position:fixed;inset:0;z-index:60;background:#1b2229;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}#mg[hidden]{display:none}#mg .mgh{display:flex;align-items:center;gap:10px;color:#fff;font:600 16px Rubik,Arial,sans-serif}#mg .mgh span{margin-left:auto;font-size:14px;opacity:.9}#mgX{width:36px;height:36px;border-radius:50%;border:0;background:#fff3;color:#fff;font-size:22px}#mgHelp{color:#cfd6dc;font:13px Rubik,Arial,sans-serif;margin:6px 0 8px}#mgC{flex:1;width:100%;border-radius:14px;touch-action:none}#mgRes{position:absolute;left:24px;right:24px;top:40%;background:#fff8ea;border-radius:16px;padding:18px;text-align:center;font:15px/1.6 Rubik,Arial,sans-serif}
.evd{width:10px;height:10px;border-radius:50%;background:#f08a24;flex:none;box-shadow:0 0 0 3px rgba(240,138,36,.25)}
.ct .startc .dot{fill:var(--gold);stroke:var(--red-d)}
.sea-lbl{font-family:var(--body);font-style:italic;font-size:14px;fill:#4b98bd;letter-spacing:.08em}

/* start screen */
#start{position:fixed;inset:0;z-index:30;overflow-y:auto;background:var(--cream);
  background-image:repeating-linear-gradient(90deg,transparent 0 22px,rgba(201,173,120,.12) 22px 26px);}
.st-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-top:calc(env(safe-area-inset-top,0px) + 22px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo .eb{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.logo h1{margin:2px 0 6px;font-family:var(--display);font-weight:400;font-size:44px;line-height:1;color:var(--ink);
  text-shadow:0 3px 0 var(--gold)}
.logo p{margin:0;color:var(--muted);font-size:15px;line-height:1.45;max-width:46ch}
.st-in h3{margin:10px 0 0;font-family:var(--display);font-weight:400;font-size:18px;display:flex;align-items:center;gap:8px}
.num{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:14px}
.smap{display:block;width:100%;height:240px;border-radius:16px;border:3px solid var(--line);background:var(--sea);touch-action:none}
.cities{display:flex;flex-wrap:wrap;gap:6px}
.cities button{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13.5px;font-weight:700}
.cities button.on{background:var(--red);border-color:var(--red-d);color:#fff}
.ccard{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.ccard h4{margin:0;font-family:var(--display);font-weight:400;font-size:19px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ccard p{margin:0;font-size:14px;line-height:1.4}
.ccard .k{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.stars{color:var(--gold-d);letter-spacing:2px;font-size:16px;white-space:nowrap}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.pick button b{font-family:var(--display);font-weight:400;font-size:16px}
.pick button small{color:var(--muted);font-size:12.5px;line-height:1.35}
.pick button.on{border-color:var(--red);box-shadow:0 0 0 3px rgba(217,65,43,.2)}
.go{display:flex;flex-direction:column;gap:10px;background:var(--cream2);border-radius:18px;padding:14px;margin-top:6px}
.go .d{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.btn.big{font-family:var(--display);font-weight:400;font-size:18px;padding:14px;border-radius:16px}
@media (prefers-reduced-motion:reduce){.bub,.hammer.on{animation:none}#toast{transition:none}}
</style>

<canvas id="hub" aria-label="3D-хаб"></canvas>
<svg id="map" hidden aria-label="Карта России"></svg>
<div id="tags"></div>

<header class="bar" id="bar" hidden>
  <div class="chip" id="cMoney"><span class="coin">₽</span><span id="vMoney">0</span></div>

  <div class="st-in">
    <div class="logo">
      <div class="eb">Транспортная империя</div>
      <h1>Магистраль</h1>

        <h3><span class="num">4</span>Время</h3>

    </div>
    </div>
  </div>
</section>

<script>
(function(){

/* ================= DATA ================= */

  yalta:{n:'Ялта',x:140,y:506,lat:44.50,lon:34.17,a:1.0},

  let dem=90*Math.sqrt(fa*CITIES[to].a)*demandMul(s)*0.9*c.d*(S.ev?seasonMul(to):1)*adsMul(to);if(v.k==='rail'&&d>2500)dem*=2500/d;if(v.k==='air'&&d<400)dem*=0.5;return dem}
function est(type,s,to,cls,used,share,mod,sch){mod=mod||0;const v=VEH[type],from=siteCity(s),d=dist(from,to,v.k),c=CLS[cls];
  const fa=s==='hq'?Math.max(1,CITIES[S.city].a):Math.max(0.6,CITIES[from].a);
  let dem=90*Math.sqrt(fa*CITIES[to].a)*demandMul(s)*0.9*c.d*(S.ev?seasonMul(to):1)*adsMul(to);
  if(v.k==='rail'&&d>2500)dem*=2500/d;
  if(v.k==='air'&&d<400)dem*=0.5;
  dem*=SCH[sch||'any'].d;const seats=Math.round(v.seats*(1+0.08*mod)),pax=Math.max(1,Math.min(seats,Math.round(dem*(share||1))));
  const intl=isIntl(from,to)?1.3*(1+0.1*Math.max(0,siteB(s).intl.l-1)):1;
  const rev=pax*d*(v.k==='rail'?RAIL_RATE:AIR_RATE)*c.p*ticketMul(s)*intl*(1+crewBonus());
  const hotel=siteB(s).hotel.l*pax*0.6*hotelMul(s);

  const time=d/(v.v*(1+0.05*mod)*(used?0.95:1)*(v.k==='rail'?(SC().railSpeed||1):1))+(v.k==='rail'?0.5:1);

const pairSeats=(s,to)=>S.routes.reduce((a,r)=>a+(r.site===s&&r.to===to?VEH[vehOf(r).type].seats:0),0);

  for(const bd of S.builds.filter(b=>S.h>=b.end)){S.builds.splice(S.builds.indexOf(bd),1);if(bd.site!=='hq'&&!S.hubs[bd.site])continue;

    toast(siteName(bd.site)+': '+bname(bd.id,bd.site)+', уровень '+bd.to+' готов');sfx('done');refreshSheet()}
  evInit();rollEvents();vsmTick();bldTick();qEnsure();if(++achN%20===0)achTick();const na=activeEv().length+offers().length;if(na!==S.ev.na){S.ev.na=na;mapDirty=true;refreshEvChip()}
  const hr=S.h%24;for(const r of S.routes){const rs=routeState(r);if(rs.pause)continue;if(r.sch&&r.sch!=='any'&&r.t<=0&&!schOk(r.sch,hr))continue;const e=routeEst(r);r.t+=dh*rs.slow;
    while(r.t>=e.time){r.t-=e.time;if(r.sch&&r.sch!=='any')r.t=0;r.dir^=1;S.legs++;qAdd('legs',1);qAdd('pax',e.pax);S.stats.pax+=e.pax;maybeBreak(r);legDone(r);if(S.crew)S.crew.xp=Math.min(100,S.crew.xp+0.03);lgLeg(r);
      if(e.net>=0){const k=siteB(r.site).kassa;k.st=Math.min(KCAP[k.l-1],k.st+e.net)}else S.money+=e.net}}
  for(const s of sites()){const c=siteB(s).cargo;if(c.l>0)c.st=Math.min(CCAP[c.l],c.st+cargoRate(s)*dh)}
}

  if(id==='intl'&&s==='hq'&&S.b.main.l<5+to)return 'Нужен '+bname('main')+' штаба '+(5+to)+' уровня';
  if(id==='intl'&&s!=='hq'&&!S.b.intl.l)return 'Сначала постройте международный терминал в штабе';
  if(UNLOCK[id]&&b[id].l===0&&S.b.main.l<UNLOCK[id])return 'Откроется с '+bname('main').toLowerCase().replace('вокзал','вокзалом').replace('аэропорт','аэропортом')+' штаба '+UNLOCK[id]+' уровня';

  const h=Math.floor(m/60);return h+' ч'+(m%60?' '+(m%60)+' мин':'')}

function effText(s,id,L){

    case 'school':return 'Курс: '+plur(1+L,'экипаж','экипажа','экипажей')+' за '+ghr(trainTime(L))+' ч';

function vline(type){const v=VEH[type];return v.seats+' мест · '+v.v+' км/ч · '+(v.max>50000?'любая дальность':'до '+fm(v.max)+' км')}

$('#compCols').addEventListener('click',e=>{const b=e.target.closest('[data-col]');if(b){setup.color=b.dataset.col;drawStart()}});
let freshArm=0,freshOpen=false;
$('#contBox').addEventListener('click',e=>{if(e.target.id==='contBtn'){const x=load(setup.kind);if(!x)return;S=x;freshOpen=false;if(S.mode==='real'){const gap=Date.now()-(S.last||Date.now());enterGame(false);if(gap>2000)catchUp(gap)}else enterGame(false)}
  if(e.target.id==='freshBtn'){if(freshArm&&Date.now()-freshArm<3000){freshArm=0;freshOpen=true;try{localStorage.removeItem(keyFor(setup.kind))}catch(_){}drawStart()}else{freshArm=Date.now();drawStart()}}});
$('#startBtn').addEventListener('click',()=>{setup.name=($('#compName').value||'').trim()||'AlimTransport';newGame(setup.city,setup.kind,setup.mode);save();enterGame(true)});

function enterGame(fresh){$('#start').hidden=true;['#bar','#nav'].forEach(s=>$(s).hidden=false);
  if(gameMap){gameMap=null;const old=$('#map'),n=old.cloneNode(false);old.replaceWith(n)}mapMode='ru';
  if(!S.company)S.company={name:'AlimTransport',color:COLORS[0]};const needBrand=!S.branded;S.branded=1;
  view='hq';makeTags();buildWorld();placeCam();setTab('hub');resize();hud();
  if(!fresh&&needBrand)openSheet(brandSheet,true);
  if(fresh)openSheet(()=>`<div class="sh-h"><h2>Ваш штаб: ${esc(CITIES[S.city].n)}</h2></div><p class="sub">У вас есть ${esc(VEH[S.veh[0].type].n)} и ${fm(S.money)} ₽ на старт.${S.city==='yalta'?' Штаб в Ялте, а рейсы уходят из Симферополя.':''}</p><div class="note">Откройте карту, коснитесь соседнего города с жёлтой точкой и запустите первый рейс. Выручка придёт в кассу.</div><button class="btn w" data-a="tab" data-v="map">Открыть карту</button>`)}

/* ================= LOOP ================= */
let lastT=performance.now(),saveAcc=0,uiAcc=0,lastR=0,shadowTick=0;
const totalKassa=()=>sites().reduce((a,s)=>a+siteB(s).kassa.st,0);
function catchUp(ms){const before=totalKassa();simChunked(Math.min(ms,12*3600e3)/msPerH());const gain=totalKassa()-before;if(gain>=1)toast('Пока вас не было, в кассы пришло '+fm(gain)+' ₽')}
function loop(now){let dt=now-lastT;lastT=now;
  if(S&&$('#start').hidden){
    if(dt>2000){if(S.mode==='real')catchUp(dt);dt=0}
    sim(dt/msPerH());
    saveAcc+=dt;if(saveAcc>4000){saveAcc=0;save()}
    uiAcc+=dt;if(uiAcc>500){uiAcc=0;hud();if(sheetFn&&!sheetStatic&&!$('#sheet').matches(':active')&&!tooSoon())renderSheet()}
    const gap=now-lastR,need=tab==='hub'?(sheetFn?100:(GFX.eco?41:32)):66;
    if(gap>=need-3&&!MG.on){lastR=now;
      if(tab==='hub'){animateBase(now,gap);if(shadowDirty||(S.builds.length&&++shadowTick>=15)){shadowTick=0;shadowDirty=false;renderer.shadowMap.needsUpdate=true}renderer.render(scene,camera);placeTags()}
      else if(tab==='map'){if(mapDirty)renderMap();animateMap()}}
  }
  requestAnimationFrame(loop)}
document.addEventListener('visibilitychange',()=>{if(!S)return;if(document.hidden)save();else if(S.mode==='real'){const gap=Date.now()-S.last;if(gap>2000){catchUp(gap);S.last=Date.now()}lastT=performance.now()}else lastT=performance.now()});
addEventListener('pagehide',save);

if(location.hash==='#dbg')window.__dbg={cam,placeCam,S:()=>S,renderer};
window.__back=()=>{if(sheetFn){closeSheet();return true}if(!$('#start').hidden)return false;if(tab!=='hub'){setTab('hub');return true}return false};
/* ================= BOOT ================= */
let lastKind=null;try{lastKind=localStorage.getItem('magistral-last')}catch(_){}
const saved=lastKind&&load(lastKind);
if(saved){S=saved;if(S.mode==='real'){const gap=Date.now()-(S.last||Date.now());enterGame(false);if(gap>2000)catchUp(gap)}else enterGame(false)}
else showStart();
resize();requestAnimationFrame(loop);
})();
</script>

</body></html>
