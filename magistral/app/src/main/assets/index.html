<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>Магистраль</title>
</head><body>
<style>
/* Layout: one-screen game. 3D hub or map fills the screen, resource bar on top, tab bar at the bottom, sheets slide up over it */
:root{
  --ink:#2a2018; --muted:#7b6a55; --cream:#fff8e8; --cream2:#f7e9c9; --line:#e6d1a7;
  --red:#d9412b; --red-d:#a8301e; --green:#4fa83a; --green-d:#357a25; --gold:#ffc23d; --gold-d:#c98d0a;
  --blue:#2f7fbf; --blue-d:#1f5b8f; --sea:#8fd0ec; --land:#f3e5bd; --shore:#c9ad78; --river:#7cc4e6;
  --display:"Russo One",system-ui,sans-serif; --body:"Rubik",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;background:#9fdcf5;color:var(--ink);font-family:var(--body)}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{cursor:default}
#hub,#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#map{background:var(--sea)}
#hub[hidden],#map[hidden]{display:none}

/* top bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:6px;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.chip{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--cream);border:2px solid var(--line);border-radius:12px;
  padding:4px 9px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(60,40,10,.15);white-space:nowrap}
.chip.neg{color:var(--red)}
.chip small{font-weight:500;color:var(--muted);font-size:12px}
.sp{flex:1}
.sites{pointer-events:auto;flex-basis:100%;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.sites::-webkit-scrollbar{display:none}
.sites button{flex:none;background:var(--cream);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;box-shadow:0 3px 0 rgba(60,40,10,.15)}
.sites button.on{background:var(--blue);border-color:var(--blue-d);color:#fff;box-shadow:0 3px 0 var(--blue-d)}
.sites[hidden]{display:none}
.coin{width:17px;height:17px;flex:none;border-radius:50%;background:var(--gold);border:2px solid var(--gold-d);display:grid;place-items:center;font-size:9px;font-weight:800;color:#7a5200;line-height:1}
.val{width:16px;height:15px;flex:none;background:linear-gradient(90deg,var(--blue) 0 28%,transparent 28% 36%,var(--blue) 36% 64%,transparent 64% 72%,var(--blue) 72%);clip-path:polygon(0 60%,28% 60%,28% 35%,64% 35%,64% 0,100% 0,100% 100%,0 100%)}
.goalbar{height:10px;background:var(--cream2);border-radius:5px;overflow:hidden}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:5px}
.tag.compact .n{display:none}
.pbar{display:block;width:64px;height:5px;background:var(--cream2);border-radius:3px;overflow:hidden;margin-top:3px}.pbar b{display:block;height:100%;background:var(--green)}
.bub.timer{flex-direction:column;align-items:stretch}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.inp{width:100%;box-sizing:border-box;font:inherit;font-size:16px;font-weight:700;padding:11px 13px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--blue)}
.prev{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.prev .bodyc{flex:1;height:34px;border-radius:17px 8px 8px 17px;background:#eef0f2;position:relative;overflow:hidden;display:flex;align-items:center;padding-left:14px;font-weight:800;font-size:14px}
.prev .bodyc i{position:absolute;left:0;right:0;bottom:3px;height:4px}
#win{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(40,25,10,.55);padding:20px}
#win .card{background:var(--cream);border-radius:22px;padding:24px 20px;max-width:360px;text-align:center;display:flex;flex-direction:column;gap:10px}
#win h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px}
#win p{margin:0;line-height:1.45}
.hammer{width:14px;height:14px;flex:none;border-radius:3px;background:var(--muted)}
.hammer.on{background:var(--gold-d);animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(.75)}}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:8px;justify-content:center;
  padding-top:8px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));pointer-events:none}
.nav button{pointer-events:auto;flex:1;max-width:140px;background:var(--cream);border:2px solid var(--line);border-radius:14px;padding:9px 6px;
  font-family:var(--display);font-size:13px;box-shadow:0 4px 0 rgba(60,40,10,.18)}
.nav button.on{background:var(--red);border-color:var(--red-d);color:#fff;box-shadow:0 4px 0 var(--red-d)}
.nav button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(60,40,10,.18)}

/* hub overlays */
#tags{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:3px}
.tag .nm{background:rgba(255,248,232,.92);border:1.5px solid var(--line);border-radius:9px;padding:2px 7px;font-size:11.5px;font-weight:700;white-space:nowrap;display:flex;gap:5px;align-items:center}
.tag .lv{background:var(--blue);color:#fff;border-radius:6px;padding:0 5px;font-size:10.5px;font-weight:800}
.tag .lv.zero{background:var(--muted)}
.bub{display:flex;align-items:center;gap:4px;background:var(--gold);border:2px solid var(--gold-d);border-radius:999px;padding:3px 9px 3px 4px;font-weight:800;font-size:12.5px;
  box-shadow:0 3px 0 var(--gold-d);animation:bob 1.2s ease-in-out infinite alternate;font-variant-numeric:tabular-nums}
.bub.full{background:#ffdf8a;border-color:var(--red);box-shadow:0 3px 0 var(--red)}
.bub.timer{background:var(--cream);border-color:var(--line);box-shadow:0 3px 0 rgba(60,40,10,.18);padding:3px 9px;animation:none}
@keyframes bob{to{transform:translateY(-4px)}}

/* sheet */
#backdrop{position:fixed;inset:0;z-index:19;background:rgba(40,25,10,.18)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:74%;overflow-y:auto;background:var(--cream);border-top:3px solid var(--line);
  border-radius:22px 22px 0 0;box-shadow:0 -8px 24px rgba(40,25,10,.18);
  padding-top:16px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .sx{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:50%;background:var(--cream2);font-size:20px;line-height:1;font-weight:700;z-index:1}
#sheetBody{display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto}
.sh-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-right:40px}
.sh-h h2{margin:0;font-family:var(--display);font-weight:400;font-size:21px;line-height:1.15;text-wrap:balance}
.pill{background:var(--blue);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800}
.pill.grey{background:var(--muted)}
.sub{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.rows{display:flex;flex-direction:column;background:#fff;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;font-size:14px;border-top:1px solid var(--cream2)}
.row:first-child{border-top:0}
.row span{color:var(--muted)}
.row b{text-align:right;font-variant-numeric:tabular-nums}
.sec{font-family:var(--display);font-size:14px;margin:6px 0 0;letter-spacing:.02em}
.note{background:var(--cream2);border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.4}
.note.warn{background:#fde3dc;color:var(--red-d)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:13px;padding:10px 14px;font-weight:800;font-size:14.5px;
  background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-d)}
.btn.gold{background:var(--gold);color:#4a3200;box-shadow:0 4px 0 var(--gold-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.ghost{background:var(--cream2);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn:disabled{background:#d9cfbd;color:#8b7d68;box-shadow:0 4px 0 #bfb29b;transform:none}
.btn.w{width:100%}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-size:14.5px}
.opt .t small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.opt .pos{color:var(--green-d);font-weight:800}
.opt .ng{color:var(--red);font-weight:800}
.opt.locked{opacity:.55}
.seg{display:flex;background:var(--cream2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border-radius:9px;padding:7px 4px;font-size:13px;font-weight:700}
.seg button.on{background:#fff;box-shadow:0 2px 0 var(--line)}
.bar2{height:6px;background:var(--cream2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar2 i{display:block;height:100%;background:var(--blue);border-radius:3px}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 140px);z-index:40;transform:translate(-50%,-8px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--cream);font-weight:700;font-size:14px;padding:9px 15px;border-radius:13px;max-width:calc(100% - 32px);text-align:center;
  transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* map svg */
.ct text{font-family:var(--body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--cream);stroke-width:3px;stroke-linejoin:round;display:none}
.ct .show text,.ct.zoomed text{display:block}
.ct text.hid{display:none!important}
.ct .dot{fill:#fff;stroke:var(--ink);stroke-width:1.5px}
.ct .reach .dot{fill:var(--gold)}
.ct .dim .dot{fill:#d8ccb4;stroke:#a89878}
.ct .dim text{fill:#8b7d68}
.ct .route .dot{fill:var(--green)}
.ct .sel .dot{fill:var(--red)}
.ct .evc{fill:#f08a24;stroke:#fff;stroke-width:1.5px}
.evd{width:10px;height:10px;border-radius:50%;background:#f08a24;flex:none;box-shadow:0 0 0 3px rgba(240,138,36,.25)}
.ct .startc .dot{fill:var(--gold);stroke:var(--red-d)}
.sea-lbl{font-family:var(--body);font-style:italic;font-size:14px;fill:#4b98bd;letter-spacing:.08em}

/* start screen */
#start{position:fixed;inset:0;z-index:30;overflow-y:auto;background:var(--cream);
  background-image:repeating-linear-gradient(90deg,transparent 0 22px,rgba(201,173,120,.12) 22px 26px);}
.st-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-top:calc(env(safe-area-inset-top,0px) + 22px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo .eb{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.logo h1{margin:2px 0 6px;font-family:var(--display);font-weight:400;font-size:44px;line-height:1;color:var(--ink);
  text-shadow:0 3px 0 var(--gold)}
.logo p{margin:0;color:var(--muted);font-size:15px;line-height:1.45;max-width:46ch}
.st-in h3{margin:10px 0 0;font-family:var(--display);font-weight:400;font-size:18px;display:flex;align-items:center;gap:8px}
.num{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:14px}
.smap{display:block;width:100%;height:240px;border-radius:16px;border:3px solid var(--line);background:var(--sea);touch-action:none}
.cities{display:flex;flex-wrap:wrap;gap:6px}
.cities button{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13.5px;font-weight:700}
.cities button.on{background:var(--red);border-color:var(--red-d);color:#fff}
.ccard{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.ccard h4{margin:0;font-family:var(--display);font-weight:400;font-size:19px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ccard p{margin:0;font-size:14px;line-height:1.4}
.ccard .k{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.stars{color:var(--gold-d);letter-spacing:2px;font-size:16px;white-space:nowrap}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.pick button b{font-family:var(--display);font-weight:400;font-size:16px}
.pick button small{color:var(--muted);font-size:12.5px;line-height:1.35}
.pick button.on{border-color:var(--red);box-shadow:0 0 0 3px rgba(217,65,43,.2)}
.go{display:flex;flex-direction:column;gap:10px;background:var(--cream2);border-radius:18px;padding:14px;margin-top:6px}
.go .d{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.btn.big{font-family:var(--display);font-weight:400;font-size:18px;padding:14px;border-radius:16px}
@media (prefers-reduced-motion:reduce){.bub,.hammer.on{animation:none}#toast{transition:none}}
</style>

<canvas id="hub" aria-label="3D-хаб"></canvas>
<svg id="map" hidden aria-label="Карта России"></svg>
<div id="tags"></div>

<header class="bar" id="bar" hidden>
  <div class="chip" id="cMoney"><span class="coin">₽</span><span id="vMoney">0</span></div>
  <button class="chip" id="cVal" type="button"><span class="val"></span><span id="vVal">0</span></button>
  <button class="chip" id="cBuild" type="button"><span class="hammer" id="hm"></span><span id="vBuild">Свободен</span></button>
  <div class="sp"></div>
  <button class="chip" id="cEv" type="button" hidden><span class="evd"></span><span id="vEv">0</span></button>
  <button class="chip" id="cTime" type="button"><small id="vTime">1 июн · 08:00</small></button>
  <button class="chip" id="bMenu" type="button" aria-label="Меню">⋯</button>
  <div class="sites" id="sites" hidden></div>
  <div class="sites" id="mapSeg" hidden></div>
</header>

<nav class="nav" id="nav" hidden>
  <button type="button" data-tab="hub" class="on">Базы</button>
  <button type="button" data-tab="map">Карта</button>
  <button type="button" data-tab="routes">Маршруты</button>
</nav>

<div id="backdrop" hidden></div>
<section class="sheet" id="sheet" hidden><button class="sx" id="sx" type="button" aria-label="Закрыть">×</button><div id="sheetBody"></div></section>
<div id="toast"></div>
<div id="win" hidden><div class="card"><h2>100 трлн!</h2><p id="winText">Ваша компания стала транспортной империей.</p><button class="btn w" id="winOk" type="button">Играть дальше</button></div></div>

<section id="start" hidden>
  <div class="st-in">
    <div class="logo">
      <div class="eb">Транспортная империя</div>
      <h1>Магистраль</h1>
      <p>Постройте вокзал или аэропорт, запустите первые рейсы и растите сеть от одного города до всего мира.</p>
    </div>
    <h3><span class="num">1</span>Игра</h3>
    <div class="pick" id="kindPick"></div>
    <div id="contBox"></div>
    <div id="newBox" style="display:flex;flex-direction:column;gap:14px">
    <h3><span class="num">2</span>Компания</h3>
    <input class="inp" id="compName" maxlength="24" placeholder="AlimTransport" autocomplete="off">
    <div class="sw" id="compCols"></div>
    <h3><span class="num">3</span>Стартовый город</h3>
    <svg class="smap" id="smap" aria-label="Выбор города на карте"></svg>
    <div class="cities" id="cityChips"></div>
    <div class="ccard" id="cityCard"></div>
        <h3><span class="num">4</span>Время</h3>
    <div class="pick" id="modePick"></div>
    <div class="go">
      <div class="d"><span>Сложность</span><span class="stars" id="diffStars"></span></div>
      <button class="btn big w" id="startBtn" type="button">Начать игру</button>
    </div>
    </div>
  </div>
</section>

function fm(n){n=Math.floor(n);const a=Math.abs(n);

function hav(a,b){const t=Math.PI/180,dLat=(b.lat-a.lat)*t,dLon=(b.lon-a.lon)*t;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLon/2)**2;return 2*6371*Math.asin(Math.sqrt(x))}

function audioInit(){if(AU.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=AU.ctx=new C();
  AU.master=c.createGain();AU.master.gain.value=0.9;const comp=c.createDynamicsCompressor();AU.master.connect(comp);comp.connect(c.destination);
  AU.sfxG=c.createGain();AU.sfxG.gain.value=AU.pref.sfx?0.55:0;AU.sfxG.connect(AU.master);
  AU.musG=c.createGain();AU.musG.gain.value=AU.pref.music?0.16:0;AU.musG.connect(AU.master);
  const len=c.sampleRate*1.5,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noiseBuf=b;
  AU.next=c.currentTime+0.1;AU.timer=setInterval(musicTick,90)}catch(e){AU.ctx=null}}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{audioInit();if(AU.ctx&&AU.ctx.state==='suspended'&&!document.hidden)AU.ctx.resume()},{passive:true}));

function setAudio(kind,on){AU.pref[kind]=on;audioPrefSave();if(!AU.ctx)return;const g=kind==='music'?AU.musG:AU.sfxG,t=AU.ctx.currentTime;g.gain.cancelScheduledValues(t);g.gain.setTargetAtTime(on?(kind==='music'?0.16:0.55):0,t,0.15)}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(f,dur,o){if(!AU.ctx)return;o=o||{};const c=AU.ctx,t=(o.at!=null?o.at:c.currentTime)+0.005,osc=c.createOscillator(),g=c.createGain();
  osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+dur);if(o.det)osc.detune.value=o.det;
  const v=o.vol||0.3,a=o.att||0.005;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let node=osc;if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;osc.connect(fl);node=fl}
  node.connect(g);g.connect(o.bus||AU.sfxG);osc.start(t);osc.stop(t+dur+0.05)}
function noise(dur,o){if(!AU.ctx)return;o=o||{};const c=AU.ctx,t=(o.at!=null?o.at:c.currentTime)+0.005,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=AU.noiseBuf;f.type=o.ft||'bandpass';f.frequency.setValueAtTime(o.f||1000,t);if(o.fto)f.frequency.exponentialRampToValueAtTime(o.fto,t+dur);f.Q.value=o.q||1;
  const v=o.vol||0.3,a=o.att||0.005;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(o.bus||AU.sfxG);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05)}
const SFX={
  tap(){tone(1500,0.05,{type:'triangle',vol:0.08})},
  coin(){tone(988,0.12,{type:'square',vol:0.07,lp:4000});tone(1319,0.35,{type:'square',vol:0.07,lp:4000,at:AU.ctx&&AU.ctx.currentTime+0.08})},
  build(){if(!AU.ctx)return;const t=AU.ctx.currentTime;for(let i=0;i<3;i++){noise(0.09,{f:900,q:3,vol:0.35,at:t+i*0.16});tone(180,0.08,{type:'triangle',vol:0.2,at:t+i*0.16})}},
  done(){if(!AU.ctx)return;const t=AU.ctx.currentTime;[72,76,79,84].forEach((m,i)=>tone(mtof(m),0.35,{type:'triangle',vol:0.18,at:t+i*0.09}))},
  goal(){if(!AU.ctx)return;const t=AU.ctx.currentTime;[[67,0],[72,0.15],[76,0.3],[79,0.45],[84,0.6]].forEach(([m,d])=>{tone(mtof(m),0.5,{type:'sawtooth',vol:0.09,lp:3000,at:t+d});tone(mtof(m-12),0.5,{type:'triangle',vol:0.12,at:t+d})})},
  error(){tone(220,0.18,{type:'square',vol:0.07,to:140,lp:1500})},
  horn(v){if(!AU.ctx)return;const t=AU.ctx.currentTime;v=v||1;for(const f of[311,370,466])tone(f,0.9,{type:'sawtooth',vol:0.05*v,lp:1400,att:0.06,at:t});for(const f of[311,370,466])tone(f,0.5,{type:'sawtooth',vol:0.05*v,lp:1400,att:0.05,at:t+1.0})},
  rumble(v){noise(2.2,{ft:'lowpass',f:220,vol:0.22*(v||1),att:0.6})},
  jet(v){noise(2.6,{f:300,fto:2200,q:0.8,vol:0.25*(v||1),att:0.8});noise(2.6,{ft:'lowpass',f:160,vol:0.2*(v||1),att:0.8})}
};

const PROG={rail:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],air:[[48,52,55,59],[45,48,52,55],[53,57,60,64],[55,59,62,65]]};
function musicTick(){const c=AU.ctx;if(!c||c.state!=='running')return;const kind=(S&&S.kind)||setup.kind||'rail',bpm=kind==='air'?76:84,st=60/bpm/2;
  while(AU.next<c.currentTime+0.4){const t=AU.next,ch=PROG[kind][AU.bar%4],s=AU.step;
    if(s===0){for(const m of ch){tone(mtof(m),st*8.2,{type:'triangle',vol:0.05,att:0.6,lp:1600,bus:AU.musG,at:t});tone(mtof(m),st*8.2,{type:'sawtooth',vol:0.012,att:0.8,lp:900,det:7,bus:AU.musG,at:t})}}
    if(s%4===0)tone(mtof(ch[0]-12),st*3.6,{type:'sine',vol:0.12,att:0.02,bus:AU.musG,at:t});
    if(kind==='rail'?(s%2===0):(s%3!==2)){const m=ch[Math.floor(Math.random()*ch.length)]+12+(Math.random()<0.25?12:0);tone(mtof(m),st*1.8,{type:'sine',vol:0.05,att:0.01,bus:AU.musG,at:t})}
    if(kind==='rail'&&s%2===1)noise(0.05,{f:6000,q:0.7,vol:0.025,bus:AU.musG,at:t});
    AU.next+=st;AU.step=(s+1)%8;if(AU.step===0)AU.bar++}}
function sfx(n,v){if(!AU.pref.sfx)return;audioInit();if(AU.ctx&&SFX[n])try{SFX[n](v)}catch(e){}}

function canServe(type,s,to){const v=VEH[type],c=CITIES[to],from=siteCity(s);
  if(!kindAvail(v.k))return 'Не тот вид транспорта';
  if(v.foreign&&S.b.intl.l<1)return 'Зарубежная техника доступна после международного терминала в штабе';
  if(isIntl(from,to)&&siteB(s).intl.l<1)return 'Нужен международный терминал в '+(s==='hq'?'штабе':'этом хабе');
  if(v.vsm&&!onVsm(from,to))return 'Ходит только по готовой ВСМ между её городами';
  if(v.k==='rail'&&CITIES[from].w&&!CITIES[from].rail)return 'Отсюда нет пути по суше';
  if(v.k==='rail'&&c.w&&!c.rail)return 'Сюда нет пути по суше, только самолётом';
  const ta=tierAvail(v.k,s);if(v.tier>ta)return 'Нужно '+v.tier+'-е поколение техники, у базы '+ta+'-е';
  if(v.k==='rail'&&(c.airOnly||CITIES[from].airOnly))return 'Сюда только самолётом';
  const d=dist(from,to,v.k);if(d>v.max)return 'Путь '+fm(d)+' км, а техника ходит до '+fm(v.max)+' км';
  if(v.only&&!(v.only.includes(from)&&v.only.includes(to)))return 'Ходит только между Москвой, Петербургом и Нижним Новгородом';
  return ''}
function est(type,s,to,cls,used){const v=VEH[type],from=siteCity(s),d=dist(from,to,v.k),c=CLS[cls];
  const fa=s==='hq'?Math.max(1,CITIES[S.city].a):Math.max(0.6,CITIES[from].a);
  let dem=90*Math.sqrt(fa*CITIES[to].a)*demandMul(s)*0.9*c.d*(S.ev?seasonMul(to):1);
  if(v.k==='rail'&&d>2500)dem*=2500/d;
  if(v.k==='air'&&d<400)dem*=0.5;
  const pax=Math.max(1,Math.min(v.seats,Math.round(dem)));
  const intl=isIntl(from,to)?1.3*(1+0.1*Math.max(0,siteB(s).intl.l-1)):1;
  const rev=pax*d*(v.k==='rail'?RAIL_RATE:AIR_RATE)*c.p*ticketMul(s)*intl;
  const hotel=siteB(s).hotel.l*pax*0.6*hotelMul(s);
  const cost=d*v.fuel*fuelMul(s)*(used?1.3:1);
  const time=d/(v.v*(used?0.95:1)*(v.k==='rail'?(SC().railSpeed||1):1))+(v.k==='rail'?0.5:1);
  const net=rev+hotel-cost;
  return {d,pax,load:pax/v.seats,rev,hotel,cost,net,time,perH:net/time}}
const routeEst=r=>{const v=vehOf(r);return est(v.type,r.site,r.to,r.cls,v.used)};
const usedPrice=t=>Math.round(VEH[t].price*0.55/100)*100;
function bcost(s,id,L){const base=(s==='hq'?BBASE:HBASE)[id]*Math.pow(2.6,L-(STARTS_AT_ONE[id]?2:1));return Math.round(base*(s==='hq'?SC().cost:1)/100)*100}
const maxL=(s,id)=>BMAX[id];
const paused=r=>!!(S.ev&&routeState(r).pause);
const cargoUnits=s=>S.routes.reduce((a,r)=>a+(r.site===s&&!paused(r)?(VEH[vehOf(r).type].k==='rail'?3:1):0),0);
function cargoRate(s){if(s==null)return sites().reduce((a,x)=>a+cargoRate(x),0);return siteB(s).cargo.l*45*cargoMul()*cargoUnits(s)}
function valuation(){const p={cash:S.money,bld:S.hubSpent*0.7,veh:0,rt:0};
  for(const s of sites()){const b=siteB(s);p.cash+=b.kassa.st+b.cargo.st;for(const id of siteIds(s))for(let L=STARTS_AT_ONE[id]?2:1;L<=b[id].l;L++)p.bld+=bcost(s,id,L)*0.7}
  for(const x of S.veh)p.veh+=VEH[x.type].price*(x.used?0.3:0.6);
  for(let i=1;i<S.builders;i++)p.bld+=BUILDER_COST[i]*0.7;
  for(const r of S.routes){if(paused(r))continue;const e=routeEst(r);if(e.perH>0)p.rt+=e.perH*24*5}
  p.total=p.cash+p.bld+p.veh+p.rt;return p}
function checkGoal(V){if(S.goal==null){S.goal=GOALS.filter(g=>V>=g).length;return}
  while(S.goal<GOALS.length&&V>=GOALS[S.goal]){S.goal++;
    if(S.goal===GOALS.length){$('#winText').textContent='Ваша компания стоит '+fm(V)+' ₽. На это ушло '+(Math.floor(S.h/24)+1)+' игровых дней.';$('#win').hidden=false;sfx('goal')}
    else{toast('Компания стоит '+fm(GOALS[S.goal-1])+' ₽! Следующая цель: '+fm(GOALS[S.goal])+' ₽');sfx('goal')}}}

/* ================= SIMULATION ================= */
function sim(dh){
  S.h+=dh;
  for(const bd of S.builds.filter(b=>S.h>=b.end)){S.builds.splice(S.builds.indexOf(bd),1);if(bd.site!=='hq'&&!S.hubs[bd.site])continue;
    siteB(bd.site)[bd.id].l=bd.to;if(bd.site===view){rebuildBuilding(bd.id);if(bd.id==='intl'){rebuildBuilding(bd.id)}else if(bd.id==='main'||bd.id==='hotel'){people.forEach(p=>{if(!p.userData.worker)world.remove(p)});people=people.filter(p=>p.userData.worker);spawnPeople()}}mapDirty=true;
    toast(siteName(bd.site)+': '+bname(bd.id,bd.site)+', уровень '+bd.to+' готов');sfx('done');refreshSheet()}
  evInit();rollEvents();vsmTick();const na=activeEv().length+offers().length;if(na!==S.ev.na){S.ev.na=na;mapDirty=true;refreshEvChip()}
  for(const r of S.routes){const rs=routeState(r);if(rs.pause)continue;const e=routeEst(r);r.t+=dh*rs.slow;
    while(r.t>=e.time){r.t-=e.time;r.dir^=1;S.legs++;maybeBreak(r);legDone(r);
      if(e.net>=0){const k=siteB(r.site).kassa;k.st=Math.min(KCAP[k.l-1],k.st+e.net)}else S.money+=e.net}}
  for(const s of sites()){const c=siteB(s).cargo;if(c.l>0)c.st=Math.min(CCAP[c.l],c.st+cargoRate(s)*dh)}
}
function simChunked(dh){while(dh>0){const s=Math.min(dh,1);sim(s);dh-=s}}

function upgradeBlock(s,id){const b=siteB(s),to=b[id].l+1;

  if(id==='intl'&&s==='hq'&&S.b.main.l<5+to)return 'Нужен '+bname('main')+' штаба '+(5+to)+' уровня';
  if(id==='intl'&&s!=='hq'&&!S.b.intl.l)return 'Сначала постройте международный терминал в штабе';

  return ''}

function collect(s,id){const b=siteB(s)[id];if(b.st<1)return;const v=Math.floor(b.st);S.money+=v;b.st-=v;toast('+'+fm(v)+' ₽');sfx('coin');hud();refreshSheet();save()}
function buy(type){let used=false;if(type.startsWith('u:')){used=true;type=type.slice(2)}const v=VEH[type],price=used?usedPrice(type):v.price;if(S.veh.length>=slots()){toast('Нет мест для техники. Улучшите '+(S.kind==='rail'?'депо':'ангар')+' в штабе или хабе');return null}

function sell(vid){const i=S.veh.findIndex(v=>v.id===vid);if(i<0||S.veh[i].route)return;const v=S.veh[i];const sv=Math.round(VEH[v.type].price*(v.used?0.25:0.5));S.money+=sv;S.veh.splice(i,1);toast('Продано за '+fm(sv)+' ₽');hud();refreshSheet();save()}
function launch(s,to,choice,cls){let v;const type=choice.startsWith('v:')?(S.veh.find(x=>x.id===+choice.slice(2))||{}).type:choice.slice(2);

/* ================= DURATIONS ================= */
function rdur(gh){const s=Math.max(0,Math.ceil(gh*msPerH()/1000));
  if(s<60)return s+' с';const m=Math.floor(s/60);
  if(m<60)return m+' мин'+(m<10&&s%60?' '+(s%60)+' с':'');
  const h=Math.floor(m/60);return h+' ч'+(m%60?' '+(m%60)+' мин':'')}
/* ================= SEASONS, EVENTS, VSM ================= */
const MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

const monthIdx=()=>(Math.floor(gameDay()/30)+5)%12;

function seasonMul(id){const m=monthIdx(),sum=m>=5&&m<=7,win=m===11||m<=1;let k=1;
  if(RESORT[id])k*=sum?1+0.4*RESORT[id]:win?(id==='sochi'?1.15:1-0.3*RESORT[id]):1;
  if(WARM[id])k*=win?1+0.4*WARM[id]:sum?1-0.2*WARM[id]:1;
  const d=dayOfMonth();if((m===11&&d>=28)||(m===0&&d<=8))k*=1.4;else if(m===4&&d<=10)k*=1.2;
  return k}
function seasonText(){const m=monthIdx(),d=dayOfMonth();
  if((m===11&&d>=28)||(m===0&&d<=8))return 'Новогодние праздники: спрос ×1,4';
  if(m===4&&d<=10)return 'Майские праздники: спрос ×1,2';
  if(m>=5&&m<=7)return 'Лето: курорты юга переполнены';
  if(m===11||m<=1)return 'Зима: спрос на юг падает, растёт на Сочи и тёплые страны';
  return ''}
/* region risk for drone raids (0..1) */
const DRONE={sev:1,yalta:1,smf:1,krd:0.8,anapa:0.9,gelen:0.8,rnd:0.8,belg:1,kursk:0.9,vrn:0.7,sochi:0.5,msk:0.35,tula:0.4,kaluga:0.4,smol:0.5,bryansk:0.8,
  rzn:0.3,orel:0.6,spb:0.25,nn:0.2,kzn:0.2,sam:0.25,sar:0.35,vlg:0.4,astr:0.25,tver:0.25,yar:0.2,pskov:0.3,vnovg:0.2,mrv:0.2,mhk:0.15,grz:0.2,pnz:0.2};
const COAST={sev:1,yalta:1,smf:0.5,sochi:1,anapa:1,gelen:1,vvo:1,spb:0.7,mur:1,kgd:1,arh:0.8,mhk:0.8,petr:1,yuzh:1,mag:1,astr:0.4};
const COLD={nsk:1,oms:1,krs:1,irk:1,tmn:0.8,ekb:0.7,chel:0.7,tomsk:1,kem:1,brn:1,uud:1,chita:1,yak:1,nor:1,surg:1,sal:1,mag:1,blag:0.8,khv:0.8,mur:0.8,arh:0.8,skt:0.8,prm:0.6,kir:0.6};
const FOG={msk:1,spb:1,kgd:1,vvo:0.8,arh:0.6,mur:0.6,petr:0.8,yuzh:0.8};

function evInit(){if(!S.ev)S.ev={list:[],next:S.h+6,seq:1};if(!S.vsm)S.vsm={}}

const offers=()=>S.ev.list.filter(e=>e.type==='gov'&&e.end>S.h&&!e.done);
function pickWeighted(map,filter){const ids=Object.keys(map).filter(filter||(()=>true));if(!ids.length)return null;let t=0;for(const i of ids)t+=map[i];let r=Math.random()*t;for(const i of ids){r-=map[i];if(r<=0)return i}return ids[0]}
const relevant=id=>S.routes.some(r=>r.to===id||siteCity(r.site)===id);

  S.ev.list=S.ev.list.filter(e=>e.end>S.h-2&&!(e.type==='gov'&&e.done));
  const m=monthIdx(),win=m===11||m<=2,r=Math.random();
  if(r<0.22){const id=pickWeighted(DRONE,relevant);if(!id||Math.random()>DRONE[id]*1.3)return;const dur=3+Math.random()*5;
    const e=addEv({type:'drones',city:id,start:S.h,end:S.h+dur});let dmg='';

      if(base){const k=siteB(base).kassa,lost=Math.floor(k.st*0.3);k.st-=lost;if(lost>0)dmg=' Повреждена касса базы: потеряно '+fm(lost)+' ₽.'}

    addEv({type:'gov',city:id,start:S.h,end:S.h+30+Math.random()*30,reward,what:pool[Math.floor(Math.random()*pool.length)],acc:false});toast('Новый госзаказ: '+CITIES[id].n+'. Откройте «События»');sfx('coin')}}

function refreshEvChip(){const n=S&&S.ev?activeEv().length+offers().length:0,el=$('#cEv');if(!el)return;el.hidden=!n;$('#vEv').textContent=n}

function vline(type){const v=VEH[type];return v.seats+' мест · '+v.v+' км/ч · '+(v.max>50000?'любая дальность':'до '+fm(v.max)+' км')}
function depotHTML(){let h=`<div class="sec">Техника всех баз · ${S.veh.length} из ${slots()} мест</div><div class="opts">`;

  <button class="btn ghost w" data-a="test">Режим теста: ${S.test?'включён':'выключен'}</button>
  <div class="sec">Как играть</div>
  <div class="note">1. На карте коснитесь города с жёлтой точкой и запустите рейс.<br>2. Выручка копится в кассе базы. Собирайте её касанием по монете.<br>3. Улучшайте здания штаба: главное здание открывает дальность, технику и хабы.<br>4. Хаб открывается в городе, куда уже идёт ваш рейс.<br>5. С 6 уровня главного здания стройте международный терминал и выходите в мир: карта «Мир» на вкладке «Карта».<br>6. Цель: оценка компании 100 трлн ₽.</div>
  <button class="btn ghost w" data-a="switch">Сменить игру</button>
  <button class="btn red w" data-a="reset">${resetArm&&Date.now()-resetArm<3000?'Точно начать заново? Нажмите ещё раз':'Новая игра'}</button>`}
let resetArm=0;const brandDraft={color:COLORS[0]};
function updPrev(){const p=$('#brandPrev');if(!p)return;const n=($('#brandIn').value||'').trim()||'AlimTransport';p.querySelector('span').textContent=n;p.querySelector('span').style.color=brandDraft.color;p.querySelector('i').style.background=brandDraft.color}
function brandSheet(){brandDraft.color=brandColor();return `<div class="sh-h"><h2>Ваша компания</h2></div><p class="sub">Название и фирменный цвет появятся на поездах, самолётах и вокзалах.</p>
  <input class="inp" id="brandIn" maxlength="24" value="${esc(brandName())}" placeholder="AlimTransport" autocomplete="off">
  <div class="sw">${COLORS.map(c=>`<button type="button" class="${c===brandDraft.color?'on':''}" data-a="ccol" data-v="${c}" style="background:${c}" aria-label="Цвет"></button>`).join('')}</div>
  <div class="prev" id="brandPrev"><div class="bodyc"><span style="color:${brandDraft.color}">${esc(brandName())}</span><i style="background:${brandDraft.color}"></i></div></div>
  <button class="btn w" data-a="csave">Сохранить</button>`}
$('#sheetBody').addEventListener('input',e=>{if(e.target.id==='brandIn')updPrev()});
$('#sheetBody').addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;if(tooSoon()){e.preventDefault();return}const a=t.dataset.a,v=t.dataset.v;if(!['up','collect','hire','go','hub'].includes(a))sfx('tap');
  switch(a){
    case 'up':doUpgrade(view,v);break;
    case 'hire':hire();break;
    case 'finish':{e.stopPropagation();const bd=bOf(t.dataset.s,v);if(bd){bd.end=S.h;bd.start=Math.min(bd.start??S.h,S.h)}break}
    case 'test':S.test=!S.test;refreshSheet();save();break;
    case 'mus':setAudio('music',!AU.pref.music);refreshSheet();break;
    case 'snd':setAudio('sfx',!AU.pref.sfx);refreshSheet();break;
    case 'switch':save();closeSheet();setup.kind=S.kind;S=null;showStart();break;
    case 'brand':openSheet(brandSheet,true);break;
    case 'ccol':document.querySelectorAll('#sheetBody [data-a=ccol]').forEach(b=>b.classList.toggle('on',b===t));brandDraft.color=v;updPrev();break;
    case 'csave':{const n=($('#brandIn').value||'').trim()||'AlimTransport';S.company={name:n,color:brandDraft.color};save();closeSheet();makeTags();buildWorld();toast('Компания '+n+' готова');break}
    case 'bld':closeSheet();if(tab!=='hub')setTab('hub');if(t.dataset.s!==view)setView(t.dataset.s);openBuilding(v);break;
    case 'collect':collect(view,v);break;
    case 'buy':if(buy(v)){toast(VEH[v.replace('u:','')].n+(v.startsWith('u:')?' (б/у)':'')+' куплен');refreshSheet()}break;
    case 'sell':sell(+v);break;
    case 'go':launch(selFrom,t.dataset.c,v,selCls);break;
    case 'scls':selCls=v;refreshSheet();break;
    case 'sfrom':selFrom=v;refreshSheet();break;
    case 'rcls':setCls(+t.dataset.r,v);break;
    case 'close':closeRoute(+v);break;
    case 'hub':openHub(v);break;
    case 'gov':{const g=S.ev.list.find(x=>x.id===+v);if(g){g.acc=true;toast('Госзаказ принят');refreshSheet();save()}break}
    case 'evs':openSheet(eventsSheet);break;
    case 'vsmo':openSheet(vsmSheet);break;
    case 'vsm':startVsm(v);break;
    case 'vsmfin':{const st=S.vsm[v];if(st){st.end=S.h;vsmTick();refreshSheet()}break}
    case 'site':closeSheet();setTab('hub');setView(v);break;
    case 'city':mapSel=v;openSheet(()=>citySheet(v));break;
    case 'tab':closeSheet();setTab(v);break;
    case 'reset':if(resetArm&&Date.now()-resetArm<3000){resetArm=0;closeSheet();try{localStorage.removeItem(keyFor(S.kind))}catch(_){}setup.kind=S.kind;S=null;showStart()}else{resetArm=Date.now();refreshSheet()}break;
  }});

/* ================= HUD & TABS ================= */
function hud(){if(!S)return;$('#vMoney').textContent=fm(S.money);$('#cMoney').classList.toggle('neg',S.money<0);const V=valuation().total;$('#vVal').textContent=fm(V);checkGoal(V);
  const hr=Math.floor(S.h%24);$('#vTime').textContent=dayOfMonth()+' '+MONTHS[monthIdx()].slice(0,3).replace('май','мая')+' · '+String(hr).padStart(2,'0')+':00';
  const fb=freeBuilders();$('#vBuild').textContent=S.builders>1?'Строители '+fb+'/'+S.builders:(S.builds.length?bname(S.builds[0].id,S.builds[0].site)+' · '+rdur(S.builds[0].end-S.h):'Свободен');$('#hm').classList.toggle('on',fb<=0)}
$('#cVal').addEventListener('click',()=>openSheet(valSheet));
$('#winOk').addEventListener('click',()=>{$('#win').hidden=true});
$('#cBuild').addEventListener('click',()=>openSheet(buildersSheet));
$('#cEv').addEventListener('click',()=>openSheet(eventsSheet));$('#cTime').addEventListener('click',()=>openSheet(eventsSheet));
$('#bMenu').addEventListener('click',()=>openSheet(menuSheet));
let tab='hub';
function setTab(t){if(t==='routes'){openSheet(routesSheet);return}
  tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  canvas.hidden=t!=='hub';tagsEl.hidden=t!=='hub';$('#map').toggleAttribute('hidden',t!=='map');renderSites();renderMapSeg();
  if(t==='map'){if(!gameMap)makeGameMap();else gameMap.fit();mapDirty=true}
  if(t==='hub')resize()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{sfx('tap');closeSheet();setTab(b.dataset.tab)}));

/* ================= START SCREEN ================= */
const setup={city:'krd',kind:'rail',mode:'fast',name:'',color:'#c8102e'};
let startMap=null;
function showStart(){['#bar','#nav'].forEach(s=>$(s).hidden=true);canvas.hidden=true;tagsEl.hidden=true;$('#map').setAttribute('hidden','');closeSheet();$('#start').hidden=false;
  $('#compCols').innerHTML=COLORS.map(c=>`<button type="button" data-col="${c}" style="background:${c}" aria-label="Цвет ${c}"></button>`).join('');
  $('#cityChips').innerHTML=START_ORDER.map(id=>`<button type="button" data-c="${id}">${CITIES[id].n}</button>`).join('');
  const sv=k=>{const x=load(k);return x?`<small><b>Есть игра:</b> ${esc((x.company&&x.company.name)||'AlimTransport')}, ${esc(CITIES[x.city].n)}, день ${Math.floor(x.h/24)+1}</small>`:''};
  $('#kindPick').innerHTML=`<button type="button" data-k="rail"><b>Железная дорога</b><small>Вокзалы, поезда и грузы. Дешёвый старт и стабильный доход. Первая техника: электричка ЭР2.</small>${sv('rail')}</button><button type="button" data-k="air"><b>Авиация</b><small>Аэропорты и самолёты. Дорогой старт, быстрые рейсы, большая прибыль. Первый самолёт: Ан-2. Сложность +1.</small>${sv('air')}</button>`;
  $('#modePick').innerHTML=`<button type="button" data-m="fast"><b>Быстрое</b><small>Стройка за секунды и минуты. Игра идёт, только пока вы играете.</small></button><button type="button" data-m="real"><b>Реальное</b><small>Как в Clash of Clans: стройка минуты и часы, рейсы зарабатывают без вас. Сложность +1.</small></button>`;
  if(!startMap)startMap=MapView($('#smap'),{onCity(id){if(START[id]){setup.city=id;drawStart()}}});
  drawStart();setTimeout(()=>startMap.focus(setup.city,520),30)}
function drawStart(){const s=START[setup.city];
  document.querySelectorAll('#compCols button').forEach(b=>b.classList.toggle('on',b.dataset.col===setup.color));
  document.querySelectorAll('#cityChips button').forEach(b=>b.classList.toggle('on',b.dataset.c===setup.city));
  document.querySelectorAll('#kindPick button').forEach(b=>b.classList.toggle('on',b.dataset.k===setup.kind));
  document.querySelectorAll('#modePick button').forEach(b=>b.classList.toggle('on',b.dataset.m===setup.mode));
  $('#cityCard').innerHTML=`<h4>${esc(CITIES[setup.city].n)}<span class="stars">${stars(s.diff)}</span></h4><p class="k">Стиль</p><p>${esc(s.look)}</p><p class="k">Бонус</p><p>${esc(s.bonus)}</p><p class="k">Минус</p><p>${esc(s.minus)}</p><p class="k">Особое здание</p><p>${esc(s.local.n)}: ${esc(s.local.d.toLowerCase())}</p>`;
  $('#diffStars').textContent=stars(diffOf(setup.city,setup.kind,setup.mode));
  const ex=load(setup.kind);$('#contBox').innerHTML=ex?`<div class="go"><div class="d"><span>${esc((ex.company&&ex.company.name)||'AlimTransport')} · ${esc(CITIES[ex.city].n)}</span><span>день ${Math.floor(ex.h/24)+1}</span></div><button class="btn big w" id="contBtn" type="button">Продолжить игру</button><button class="btn ghost w" id="freshBtn" type="button">${freshArm&&Date.now()-freshArm<3000?'Старая игра удалится. Нажмите ещё раз':'Начать заново'}</button></div>`:'';
  $('#newBox').style.display=ex&&!freshOpen?'none':'flex'
  startMap.cities(id=>START[id]?('startc'+(id===setup.city?' sel show':'')+(LEFT_LBL[id]?' left':'')):(id==='smf'&&setup.city==='yalta'?'show':null))}
$('#cityChips').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;setup.city=b.dataset.c;drawStart();startMap.focus(setup.city,520)});
$('#kindPick').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b){setup.kind=b.dataset.k;drawStart()}});
$('#modePick').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b){setup.mode=b.dataset.m;drawStart()}});
$('#compCols').addEventListener('click',e=>{const b=e.target.closest('[data-col]');if(b){setup.color=b.dataset.col;drawStart()}});
let freshArm=0,freshOpen=false;
$('#contBox').addEventListener('click',e=>{if(e.target.id==='contBtn'){const x=load(setup.kind);if(!x)return;S=x;freshOpen=false;if(S.mode==='real'){const gap=Date.now()-(S.last||Date.now());enterGame(false);if(gap>2000)catchUp(gap)}else enterGame(false)}
  if(e.target.id==='freshBtn'){if(freshArm&&Date.now()-freshArm<3000){freshArm=0;freshOpen=true;try{localStorage.removeItem(keyFor(setup.kind))}catch(_){}drawStart()}else{freshArm=Date.now();drawStart()}}});
$('#startBtn').addEventListener('click',()=>{setup.name=($('#compName').value||'').trim()||'AlimTransport';newGame(setup.city,setup.kind,setup.mode);save();enterGame(true)});

function enterGame(fresh){$('#start').hidden=true;['#bar','#nav'].forEach(s=>$(s).hidden=false);
  if(gameMap){gameMap=null;const old=$('#map'),n=old.cloneNode(false);old.replaceWith(n)}mapMode='ru';
  if(!S.company)S.company={name:'AlimTransport',color:COLORS[0]};const needBrand=!S.branded;S.branded=1;
  view='hq';makeTags();buildWorld();placeCam();setTab('hub');resize();hud();
  if(!fresh&&needBrand)openSheet(brandSheet,true);
  if(fresh)openSheet(()=>`<div class="sh-h"><h2>Ваш штаб: ${esc(CITIES[S.city].n)}</h2></div><p class="sub">У вас есть ${esc(VEH[S.veh[0].type].n)} и ${fm(S.money)} ₽ на старт.${S.city==='yalta'?' Штаб в Ялте, а рейсы уходят из Симферополя.':''}</p><div class="note">Откройте карту, коснитесь соседнего города с жёлтой точкой и запустите первый рейс. Выручка придёт в кассу.</div><button class="btn w" data-a="tab" data-v="map">Открыть карту</button>`)}

/* ================= LOOP ================= */
let lastT=performance.now(),saveAcc=0,uiAcc=0;
const totalKassa=()=>sites().reduce((a,s)=>a+siteB(s).kassa.st,0);
function catchUp(ms){const before=totalKassa();simChunked(Math.min(ms,12*3600e3)/msPerH());const gain=totalKassa()-before;if(gain>=1)toast('Пока вас не было, в кассы пришло '+fm(gain)+' ₽')}
function loop(now){let dt=now-lastT;lastT=now;
  if(S&&$('#start').hidden){
    if(dt>2000){if(S.mode==='real')catchUp(dt);dt=0}
    sim(dt/msPerH());
    saveAcc+=dt;if(saveAcc>4000){saveAcc=0;save()}
    uiAcc+=dt;if(uiAcc>500){uiAcc=0;hud();if(sheetFn&&!sheetStatic&&!$('#sheet').matches(':active')&&!tooSoon())renderSheet()}
    if(tab==='hub'){animateBase(now,dt);renderer.render(scene,camera);placeTags()}
    else if(tab==='map'){if(mapDirty)renderMap();animateMap()}
  }
  requestAnimationFrame(loop)}
document.addEventListener('visibilitychange',()=>{if(!S)return;if(document.hidden)save();else if(S.mode==='real'){const gap=Date.now()-S.last;if(gap>2000){catchUp(gap);S.last=Date.now()}lastT=performance.now()}else lastT=performance.now()});
addEventListener('pagehide',save);

window.__back=()=>{if(sheetFn){closeSheet();return true}if(!$('#start').hidden)return false;if(tab!=='hub'){setTab('hub');return true}return false};
/* ================= BOOT ================= */
let lastKind=null;try{lastKind=localStorage.getItem('magistral-last')}catch(_){}
const saved=lastKind&&load(lastKind);
if(saved){S=saved;if(S.mode==='real'){const gap=Date.now()-(S.last||Date.now());enterGame(false);if(gap>2000)catchUp(gap)}else enterGame(false)}
else showStart();
resize();requestAnimationFrame(loop);
})();
</script>

</body></html>
