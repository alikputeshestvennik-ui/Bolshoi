name: Build Android APK

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -iname "*.zip" -printf "%f\n")
          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: ZIP file not found in repository root."
            exit 1
          fi
          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "ERROR: More than one ZIP found:"
            printf ' - %s\n' "${ZIPS[@]}"
            exit 1
          fi
          echo "Found: ${ZIPS[0]}"
          echo "zip=${ZIPS[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        env:
          ZIP: ${{ steps.find_zip.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -q "$ZIP" -d project
          echo "ZIP extracted."

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE="$(find project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "settings.gradle / settings.gradle.kts is missing."
            echo "Archive contents:"
            find project -maxdepth 6 -type f | sort | head -300
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            echo "Gradle wrapper found."
            echo "use_wrapper=true" >> "$GITHUB_OUTPUT"
          else
            echo "Gradle wrapper not found; system Gradle will be used."
            echo "use_wrapper=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "Android SDK is ready."
          sdkmanager --list_installed | head -30 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Download ML models
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/download_models.sh ]; then
            bash scripts/download_models.sh
          else
            echo "WARNING: scripts/download_models.sh not found, trying manual download"
            ASSETS="shared/src/main/assets"
            mkdir -p "$ASSETS"
            curl -L --fail --retry 3 \
              "https://github.com/snakers4/silero-vad/raw/master/src/silero_vad/data/silero_vad.onnx" \
              -o "$ASSETS/silero_vad.onnx"
            curl -L --fail --retry 3 \
              "https://tfhub.dev/google/lite-model/yamnet/tflite/1?lite-format=tflite" \
              -o "$ASSETS/yamnet.tflite"
            curl -L --fail --retry 3 \
              "https://raw.githubusercontent.com/tensorflow/models/master/research/audioset/yamnet/yamnet_class_map.csv" \
              -o "$ASSETS/yamnet_class_map.csv"
          fi
          ls -lh shared/src/main/assets/ || true
          echo "Models ready."

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # Strip CR/LF/spaces that often sneak into GitHub Secrets
          KEYSTORE_B64="$(printf '%s' "$KEYSTORE_B64" | tr -d '\r\n \t')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')"
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')"

          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: Secret ANDROID_KEYSTORE_B64 is empty or unavailable."
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: Secret ANDROID_KEY_ALIAS is empty or unavailable."
            exit 1
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: Secret ANDROID_STORE_PASSWORD is empty or unavailable."
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Secret ANDROID_KEY_PASSWORD is empty or unavailable."
            exit 1
          fi
          echo "All four signing secrets are available."
          echo "KEYSTORE_B64 length: ${#KEYSTORE_B64}"
          echo "KEY_ALIAS length: ${#KEY_ALIAS}"

      - name: Decode permanent keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          # Strip whitespace/newlines from base64 secret
          CLEAN_B64="$(printf '%s' "$KEYSTORE_B64" | tr -d '\r\n \t')"
          printf '%s' "$CLEAN_B64" | base64 --decode > "$KEYSTORE_FILE"
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Decoded keystore is empty."
            exit 1
          fi
          echo "Keystore decoded successfully."
          echo "Size: $(stat -c%s "$KEYSTORE_FILE") bytes"
          file "$KEYSTORE_FILE" || true
          xxd -l 16 "$KEYSTORE_FILE" || true

      - name: Validate permanent keystore
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')"
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n')"

          echo "Trying to list keystore (errors will be shown)..."
          echo "Alias: '$KEY_ALIAS'"

          # Try auto-detect, then JKS, then PKCS12
          set +e
          OUT=$(keytool -list -keystore "$KEYSTORE_FILE" -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" 2>&1)
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "Auto-detect failed (rc=$RC):"
            echo "$OUT"
            echo "--- Trying -storetype JKS ---"
            OUT=$(keytool -list -keystore "$KEYSTORE_FILE" -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" -storetype JKS 2>&1)
            RC=$?
            if [ $RC -ne 0 ]; then
              echo "JKS failed (rc=$RC):"
              echo "$OUT"
              echo "--- Trying -storetype PKCS12 ---"
              OUT=$(keytool -list -keystore "$KEYSTORE_FILE" -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" -storetype PKCS12 2>&1)
              RC=$?
              if [ $RC -ne 0 ]; then
                echo "PKCS12 failed (rc=$RC):"
                echo "$OUT"
                echo ""
                echo "ERROR: Cannot open keystore with given alias/password."
                echo "Check GitHub Secrets:"
                echo "  ANDROID_KEYSTORE_B64  - base64 of .jks or .keystore (no newlines)"
                echo "  ANDROID_KEY_ALIAS     - exact alias (case-sensitive)"
                echo "  ANDROID_STORE_PASSWORD"
                echo "  ANDROID_KEY_PASSWORD"
                echo ""
                echo "Local check:"
                echo "  base64 -w0 your.keystore > b64.txt"
                echo "  keytool -list -keystore your.keystore -alias YOUR_ALIAS"
                exit 1
              fi
            fi
          fi
          set -e
          echo "Keystore and alias are valid."
          echo "$OUT" | head -20

      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          USE_WRAPPER: ${{ steps.project.outputs.use_wrapper }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$USE_WRAPPER" = "true" ]; then
            GRADLE="./gradlew"
          else
            GRADLE="gradle"
          fi
          "$GRADLE" :phone:assembleRelease :wear:assembleRelease --stacktrace

      - name: Find generated APKs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find project -type f -path "*/build/outputs/apk/*.apk" | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERROR: No APK files were generated."
            exit 1
          fi
          echo "Generated APKs:"
          printf ' - %s\n' "${APKS[@]}"

      - name: Sign APKs with permanent key
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')"
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          if [ ! -x "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi
          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi
          rm -rf signed
          mkdir -p signed
          mapfile -t APKS < <(find project -type f -path "*/build/outputs/apk/*.apk" | sort)
          for APK in "${APKS[@]}"; do
            REL="${APK#project/}"
            SAFE_NAME="$(echo "$REL" | tr '/' '_')"
            ALIGNED="signed/${SAFE_NAME%.apk}-aligned.apk"
            OUTPUT="signed/${SAFE_NAME%.apk}-signed.apk"
            echo "Processing: $APK"
            "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "env:STORE_PASSWORD" \
              --key-pass "env:KEY_PASSWORD" \
              --out "$OUTPUT" \
              "$ALIGNED"
            rm -f "$ALIGNED"
            "$APKSIGNER" verify --verbose "$OUTPUT"
            echo "SIGNED: $OUTPUT"
          done

      - name: Show final APKs
        shell: bash
        run: |
          set -euo pipefail
          echo "FINAL SIGNED APKs"
          ls -lh signed/*.apk
          echo ""
          echo "SHA-256:"
          sha256sum signed/*.apk

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: SpeechFilter-signed-release
          path: signed/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/release.keystore"
