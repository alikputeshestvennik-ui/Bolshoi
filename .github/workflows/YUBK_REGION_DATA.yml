name: Prepare YUBK regional building data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u yubk-3d-godot/tools/fetch_region.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: yubk-region-sources
          path: yubk-3d-android/data/region_buildings/*.gz
          retention-days: 14
