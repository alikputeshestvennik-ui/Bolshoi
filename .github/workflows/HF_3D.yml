name: HF 3D try
on:
  workflow_dispatch:
    inputs:
      mode: { description: "api|gen", default: "api" }
      space: { description: "space id", default: "tencent/Hunyuan3D-2" }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client
      - name: Work
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODE: ${{ inputs.mode }}
          SPACE: ${{ inputs.space }}
        run: |
          mkdir -p out
          python3 - <<'PY'
          import os, io, contextlib, time, shutil, json
          from gradio_client import Client, handle_file
          T=os.environ["HF_TOKEN"]; S=os.environ["SPACE"]; M=os.environ["MODE"]
          c = Client(S, hf_token=T)
          if M == "api":
              buf = io.StringIO()
              with contextlib.redirect_stdout(buf): c.view_api(all_endpoints=True)
              open("out/api_" + S.replace("/","_") + ".txt","w").write(buf.getvalue())
          else:
              img = handle_file("agent_android/app/src/main/res/drawable-nodpi/ic_launcher_art.png")
              t0 = time.time()
              code = open("gen.py").read() if os.path.exists("gen.py") else ""
              exec(open(".github/hf_gen.py").read())
              open("out/time.txt","w").write(f"{time.time()-t0:.0f} sec")
          PY
      - name: Push results
        run: |
          git config user.name "pilot-bot"; git config user.email "bot@users.noreply.github.com"
          git fetch origin hf-results || true
          git checkout -B hf-results
          git add -f out
          git commit -m "HF 3D results" || true
          git push -f origin hf-results
