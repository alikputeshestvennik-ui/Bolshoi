name: HF 3D try
on:
  workflow_dispatch:
    inputs:
      mode: { description: "api|gen", default: "api" }
      space: { description: "space id", default: "tencent/Hunyuan3D-2" }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client
      - name: Work
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODE: ${{ inputs.mode }}
          SPACE: ${{ inputs.space }}
        run: |
          python3 .github/hf_try.py
      - name: Push results
        if: always()
        run: |
          git config user.name "pilot-bot"; git config user.email "bot@users.noreply.github.com"
          git fetch origin hf-results || true
          git checkout -B hf-results
          git add -f out
          git commit -m "HF 3D results" || true
          git push -f origin hf-results
