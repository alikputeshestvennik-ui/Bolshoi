name: Build signed APK from ZIP

on:
  push:
    paths:
      - "*.zip"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . \
              -maxdepth 1 \
              -type f \
              -iname "*.zip" \
              -printf "%f\n"
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: ZIP not found in repository root."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "ERROR: More than one ZIP found:"
            printf ' - %s\n' "${ZIPS[@]}"
            exit 1
          fi

          echo "zip=${ZIPS[0]}" >> "$GITHUB_OUTPUT"
          echo "Found ZIP: ${ZIPS[0]}"

      - name: Extract ZIP
        env:
          ZIP: ${{ steps.find_zip.outputs.zip }}
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          echo "Project files:"
          find project -maxdepth 4 -type f | sort | head -200

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW=$(find project -type f -name "gradlew" | head -n 1 || true)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
            USE_WRAPPER=true

            echo "Gradle Wrapper found:"
            echo "$GRADLEW"
          else
            SETTINGS=$(find project \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -n 1 || true)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: Gradle project not found."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
            USE_WRAPPER=false

            echo "Gradle Wrapper not found."
            echo "Using installed Gradle."
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "use_wrapper=$USE_WRAPPER" >> "$GITHUB_OUTPUT"

          echo "Project directory: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses >/dev/null || true

          echo "Installing required Android SDK packages..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          [ -n "$KEYSTORE" ] || {
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          }

          [ -n "$ALIAS" ] || {
            echo "ERROR: ANDROID_KEY_ALIAS is missing."
            exit 1
          }

          [ -n "$STORE_PASSWORD" ] || {
            echo "ERROR: ANDROID_STORE_PASSWORD is missing."
            exit 1
          }

          [ -n "$KEY_PASSWORD" ] || {
            echo "ERROR: ANDROID_KEY_PASSWORD is missing."
            exit 1
          }

          echo "All signing secrets are present."

      - name: Decode permanent keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/release.keystore"

          test -s "$RUNNER_TEMP/release.keystore"

          echo "Keystore loaded successfully."

      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          USE_WRAPPER: ${{ steps.project.outputs.use_wrapper }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$USE_WRAPPER" = "true" ]; then
            chmod +x ./gradlew
            GRADLE="./gradlew"
          else
            GRADLE="gradle"
          fi

          echo "Running: $GRADLE assembleRelease"

          "$GRADLE" \
            assembleRelease \
            -Pandroid.injected.signing.store.file="$ANDROID_KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$ANDROID_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" \
            --stacktrace

      - name: Find APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          mapfile -t APKS < <(
            find project \
              -type f \
              -path "*/build/outputs/apk/*.apk"
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERROR: No APK files found."
            exit 1
          fi

          echo "APK files found:"
          printf ' - %s\n' "${APKS[@]}"

          for APK in "${APKS[@]}"; do
            NAME=$(basename "$APK")
            PARENT=$(dirname "$APK" | tr '/' '_')
            cp "$APK" "artifacts/${PARENT}_${NAME}"
          done

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          APKSIGNER="$BUILD_TOOLS/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          for APK in artifacts/*.apk; do
            echo "Verifying: $APK"
            "$APKSIGNER" verify --verbose "$APK"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SpeechFilter-signed-release
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.keystore"
