name: Build signed APK from ZIP

on:
  push:
    paths:
      - "*.zip"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . \
              -maxdepth 1 \
              -type f \
              -iname "*.zip" \
              -printf "%f\n"
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: ZIP not found in repository root."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "ERROR: More than one ZIP found:"
            printf ' - %s\n' "${ZIPS[@]}"
            exit 1
          fi

          echo "zip=${ZIPS[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        env:
          ZIP: ${{ steps.find_zip.outputs.zip }}
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

      - name: Find Gradle project
        id: gradle
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW=$(find project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode permanent keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is not configured."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

          test -s "$RUNNER_TEMP/release.keystore"

      - name: Build signed Release APK
        env:
          PROJECT_DIR: ${{ steps.gradle.outputs.project_dir }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        run: |
          set -euo pipefail

          ./gradlew \
            assembleRelease \
            -Pandroid.injected.signing.store.file="$ANDROID_KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$ANDROID_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" \
            --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          find project \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -exec cp {} artifacts/ \;

          echo "Generated APKs:"
          ls -lh artifacts/

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: SpeechFilter-signed-release
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.keystore"
