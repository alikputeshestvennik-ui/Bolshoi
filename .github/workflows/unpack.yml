name: Build signed APK from ZIP

on:
  push:
    paths:
      - "*.zip"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5


      # ---------------------------------------------------------
      # 2. Find ZIP in repository root
      # ---------------------------------------------------------

      - name: Find ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . \
              -maxdepth 1 \
              -type f \
              -iname "*.zip" \
              -printf "%f\n"
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "ERROR: More than one ZIP found:"
            printf '  - %s\n' "${ZIPS[@]}"
            exit 1
          fi

          ZIP="${ZIPS[0]}"

          echo "Found ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------------
      # 3. Extract ZIP
      # ---------------------------------------------------------

      - name: Extract ZIP
        env:
          ZIP: ${{ steps.find_zip.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          echo "Extracted project:"
          find project -maxdepth 4 -type f | sort | head -200


      # ---------------------------------------------------------
      # 4. Find Android / Gradle project
      # ---------------------------------------------------------

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(
            find project \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | head -n 1
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          GRADLEW="$PROJECT_DIR/gradlew"

          if [ -f "$GRADLEW" ]; then
            echo "Gradle Wrapper found."
            echo "use_wrapper=true" >> "$GITHUB_OUTPUT"
          else
            echo "Gradle Wrapper not found."
            echo "System Gradle will be used."
            echo "use_wrapper=false" >> "$GITHUB_OUTPUT"
          fi


      # ---------------------------------------------------------
      # 5. Java 17
      # ---------------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ---------------------------------------------------------
      # 6. Android SDK
      #
      # IMPORTANT:
      # No "packages: tools" here.
      # That package is obsolete and caused the previous failure.
      # ---------------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ---------------------------------------------------------
      # 7. Install Android SDK components
      # ---------------------------------------------------------

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo "Android SDK packages installed."


      # ---------------------------------------------------------
      # 8. Gradle
      # ---------------------------------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"


      # ---------------------------------------------------------
      # 9. Check signing secrets
      # ---------------------------------------------------------

      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_STORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD is missing."
            exit 1
          fi

          echo "All signing secrets are present."


      # ---------------------------------------------------------
      # 10. Restore permanent keystore
      # ---------------------------------------------------------

      - name: Decode permanent keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "Keystore restored."


      # ---------------------------------------------------------
      # 11. Validate keystore
      # ---------------------------------------------------------

      - name: Validate keystore
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" \
            >/dev/null

          echo "Keystore and alias are valid."


      # ---------------------------------------------------------
      # 12. Build Release
      # ---------------------------------------------------------

      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          USE_WRAPPER: ${{ steps.project.outputs.use_wrapper }}

          # Available to Gradle projects that use environment-based
          # signing configuration.
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$USE_WRAPPER" = "true" ]; then
            chmod +x ./gradlew
            GRADLE="./gradlew"
          else
            GRADLE="gradle"
          fi

          echo "Using Gradle: $GRADLE"

          "$GRADLE" \
            assembleRelease \
            --stacktrace


      # ---------------------------------------------------------
      # 13. Find generated APKs
      # ---------------------------------------------------------

      - name: Find APKs
        id: find_apks
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find project \
              -type f \
              -path "*/build/outputs/apk/*.apk"
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERROR: No APK files were generated."
            exit 1
          fi

          echo "Generated APKs:"
          printf '  - %s\n' "${APKS[@]}"


      # ---------------------------------------------------------
      # 14. Sign APKs with permanent keystore
      #
      # Gradle can produce unsigned or differently signed APKs.
      # We align them first and then apply our permanent signature.
      # ---------------------------------------------------------

      - name: Sign APKs with permanent keystore
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS" ]; then
            echo "ERROR: Android build-tools not found."
            exit 1
          fi

          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          if [ ! -x "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          mkdir -p signed

          mapfile -t APKS < <(
            find project \
              -type f \
              -path "*/build/outputs/apk/*.apk"
          )

          for APK in "${APKS[@]}"; do

            NAME="$(basename "$APK")"

            SAFE_PATH="$(
              dirname "$APK" \
              | sed 's#^project/##' \
              | tr '/' '_'
            )"

            ALIGNED="signed/${SAFE_PATH}_${NAME%.apk}-aligned.apk"
            SIGNED="signed/${SAFE_PATH}_${NAME%.apk}.apk"

            echo ""
            echo "========================================"
            echo "Processing: $APK"
            echo "========================================"

            "$ZIPALIGN" \
              -f \
              -p \
              4 \
              "$APK" \
              "$ALIGNED"

            "$APKSIGNER" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "env:STORE_PASSWORD" \
              --key-pass "env:KEY_PASSWORD" \
              --out "$SIGNED" \
              "$ALIGNED"

            rm -f "$ALIGNED"

            "$APKSIGNER" verify \
              --verbose \
              "$SIGNED"

            echo "SIGNED: $SIGNED"
          done


      # ---------------------------------------------------------
      # 15. Show final APKs
      # ---------------------------------------------------------

      - name: Show final APKs
        shell: bash
        run: |
          set -euo pipefail

          echo "Final signed APKs:"

          ls -lh signed/*.apk

          echo ""
          echo "SHA-256:"

          sha256sum signed/*.apk


      # ---------------------------------------------------------
      # 16. Upload APKs
      # ---------------------------------------------------------

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: SpeechFilter-signed-release
          path: signed/*.apk
          if-no-files-found: error
          retention-days: 30


      # ---------------------------------------------------------
      # 17. Delete keystore from runner
      # ---------------------------------------------------------

      - name: Remove keystore
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/release.keystore"
