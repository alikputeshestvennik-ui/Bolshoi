name: Build signed APK from ZIP

on:
  push:
    paths:
      - "*.zip"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # Checkout
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # =========================================================
      # Find ZIP
      # =========================================================

      - name: Find ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . \
              -maxdepth 1 \
              -type f \
              -iname "*.zip" \
              -printf "%f\n"
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "ERROR: More than one ZIP found:"
            printf ' - %s\n' "${ZIPS[@]}"
            exit 1
          fi

          echo "ZIP: ${ZIPS[0]}"
          echo "zip=${ZIPS[0]}" >> "$GITHUB_OUTPUT"


      # =========================================================
      # Extract ZIP
      # =========================================================

      - name: Extract ZIP
        env:
          ZIP: ${{ steps.find_zip.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          echo "Extracted files:"
          find project -maxdepth 4 -type f | sort | head -200


      # =========================================================
      # Find Gradle project
      # =========================================================

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(
            find project \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | head -n 1
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project: $PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            echo "Gradle Wrapper found."
            echo "use_wrapper=true" >> "$GITHUB_OUTPUT"
          else
            echo "Gradle Wrapper not found."
            echo "System Gradle will be used."
            echo "use_wrapper=false" >> "$GITHUB_OUTPUT"
          fi


      # =========================================================
      # Java
      # =========================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # Android SDK
      #
      # IMPORTANT:
      # We intentionally DO NOT use android-actions/setup-android.
      # GitHub ubuntu-latest already has Android SDK installed.
      # =========================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ERROR: ANDROID_HOME is not defined."
            exit 1
          fi

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "sdkmanager:"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version


      # =========================================================
      # Android SDK licenses
      # =========================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --licenses \
            >/dev/null 2>&1 || true

          echo "Android SDK licenses processed."


      # =========================================================
      # Install SDK components
      # =========================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo "Required Android SDK packages installed."


      # =========================================================
      # Gradle
      # =========================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"


      # =========================================================
      # Check secrets
      # =========================================================

      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          [ -n "$KEYSTORE" ] || {
            echo "ERROR: ANDROID_KEYSTORE_B64 is missing."
            exit 1
          }

          [ -n "$KEY_ALIAS" ] || {
            echo "ERROR: ANDROID_KEY_ALIAS is missing."
            exit 1
          }

          [ -n "$STORE_PASSWORD" ] || {
            echo "ERROR: ANDROID_STORE_PASSWORD is missing."
            exit 1
          }

          [ -n "$KEY_PASSWORD" ] || {
            echo "ERROR: ANDROID_KEY_PASSWORD is missing."
            exit 1
          }

          echo "All signing secrets are present."


      # =========================================================
      # Restore permanent keystore
      # =========================================================

      - name: Decode permanent keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo "Keystore restored."


      # =========================================================
      # Validate keystore
      # =========================================================

      - name: Validate keystore
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" \
            >/dev/null

          echo "Keystore is valid."
          echo "Alias is valid."


      # =========================================================
      # Build Release APK
      # =========================================================

      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          USE_WRAPPER: ${{ steps.project.outputs.use_wrapper }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$USE_WRAPPER" = "true" ]; then
            chmod +x ./gradlew
            GRADLE="./gradlew"
          else
            GRADLE="gradle"
          fi

          echo "Gradle command: $GRADLE"

          "$GRADLE" \
            assembleRelease \
            --stacktrace


      # =========================================================
      # Find APKs
      # =========================================================

      - name: Find generated APKs
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find project \
              -type f \
              -path "*/build/outputs/apk/*.apk"
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERROR: No APK files generated."
            exit 1
          fi

          echo "Generated APKs:"
          printf ' - %s\n' "${APKS[@]}"


      # =========================================================
      # Sign APKs
      # =========================================================

      - name: Sign APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort -V \
              | tail -n 1
          )"

          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          if [ ! -x "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          rm -rf signed
          mkdir -p signed

          mapfile -t APKS < <(
            find project \
              -type f \
              -path "*/build/outputs/apk/*.apk"
          )

          for APK in "${APKS[@]}"; do

            NAME="$(basename "$APK")"

            REL_DIR="$(
              dirname "$APK" \
              | sed 's#^project/##' \
              | tr '/' '_'
            )"

            ALIGNED="signed/${REL_DIR}_${NAME%.apk}-aligned.apk"
            OUTPUT="signed/${REL_DIR}_${NAME%.apk}.apk"

            echo ""
            echo "Signing:"
            echo "$APK"

            "$ZIPALIGN" \
              -f \
              -p \
              4 \
              "$APK" \
              "$ALIGNED"

            STORE_PASSWORD="$STORE_PASSWORD" \
            KEY_PASSWORD="$KEY_PASSWORD" \
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:STORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "$OUTPUT" \
              "$ALIGNED"

            rm -f "$ALIGNED"

            "$APKSIGNER" verify \
              --verbose \
              "$OUTPUT"

            echo "SIGNED: $OUTPUT"
          done


      # =========================================================
      # Show result
      # =========================================================

      - name: Show final APKs
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FINAL APK FILES"
          echo "========================================"

          ls -lh signed/*.apk

          echo ""
          echo "SHA-256:"
          sha256sum signed/*.apk


      # =========================================================
      # Upload artifact
      # =========================================================

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: SpeechFilter-signed-release
          path: signed/*.apk
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # Security cleanup
      # =========================================================

      - name: Remove keystore
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/release.keystore"
