name: Peregon · 3D railway APK
on:
  workflow_dispatch:
  push:
    branches: ['codex/peregon-game']
    paths: ['rail_game/**', '.github/workflows/PEREGON_GAME.yml']
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle offline 3D engine and test physics and graphics
        working-directory: rail_game
        run: |
          npm install
          npm run build
          npx playwright install --with-deps chromium
          npm test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: peregon-preview
          path: rail_game/delivery/
          retention-days: 7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Prepare existing signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -eu
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/peregon-release.keystore"
      - name: Build, lint and verify signed APK
        working-directory: rail_game
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/peregon-release.keystore
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          gradle --no-daemon :app:lintRelease :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk delivery/PEREGON.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify delivery/PEREGON.apk
          cd delivery
          sha256sum PEREGON.apk PEREGON-presentation.pdf > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: peregon-delivery
          path: rail_game/delivery/
          if-no-files-found: error
          retention-days: 30
      - name: Publish game and presentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "peregon-v1-${GITHUB_RUN_NUMBER}" \
            rail_game/delivery/PEREGON.apk \
            rail_game/delivery/02-train.png \
            rail_game/delivery/PEREGON-presentation.pdf \
            rail_game/delivery/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'Перегон · Долина сосен 1.0' \
            --notes-file rail_game/RELEASE.md \
            --latest=false
