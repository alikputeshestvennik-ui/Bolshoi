name: Ten provider and agent checks
on:
  push:
    branches: ['codex/ten-direct-deepseek']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @openai/codex@0.167.0
      - run: python -m pip install -r ten-agent-runtime/requirements.txt
      - run: python -m unittest discover -p "test_*.py"
        working-directory: ten-agent-runtime
      - run: TEN_RUN_CODEX_E2E=1 TEN_CODEX_SANDBOX=danger-full-access python -m unittest test_codex_e2e.py
        working-directory: ten-agent-runtime
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle :app:testDebugUnitTest --tests 'ru.alim.agent.ModelRoutingTest' --no-daemon
        working-directory: agent_android
