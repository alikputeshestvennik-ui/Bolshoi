name: Build YUBK 3D APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'yubk-3d-android/**'
      - '.github/workflows/YUBK_APK.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_B64"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/yubk-release.keystore"
          test -s "$RUNNER_TEMP/yubk-release.keystore"
      - run: |
          python3 tools/validate_walk.py
          python3 tools/validate_navigation.py
          python3 tools/validate_route.py
        working-directory: yubk-3d-android
      - run: gradle :app:assembleDebug :app:lintDebug --no-daemon
        working-directory: yubk-3d-android
      - name: Build signed release APK
        working-directory: yubk-3d-android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/yubk-release.keystore
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK=yubk-3d-android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: yubk-3d-debug-apk
          path: yubk-3d-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: yubk-3d-signed-apk
          path: yubk-3d-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test map-first teleport and GLES rendering
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          working-directory: yubk-3d-android
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest --no-daemon; result=$?; adb pull /sdcard/Download/ device-screenshots || true; exit $result
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yubk-device-test-reports
          path: |
            yubk-3d-android/app/build/reports/androidTests/
            yubk-3d-android/device-screenshots/
