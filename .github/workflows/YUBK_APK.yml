name: Build YUBK 3D APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'yubk-3d-android/**'
      - '.github/workflows/YUBK_APK.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 tools/validate_walk.py
        working-directory: yubk-3d-android
      - run: gradle :app:assembleDebug :app:lintDebug --no-daemon
        working-directory: yubk-3d-android
      - uses: actions/upload-artifact@v4
        with:
          name: yubk-3d-debug-apk
          path: yubk-3d-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
