name: Verify Agent Android

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/chatgpt-signin'
      - 'feature/ui-refresh'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Compile debug APKs
        working-directory: agent_android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :home:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: ten-debug-apk
          path: agent_android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-checks
          path: |
            agent_android/app/build/screenshots/*.png
            agent_android/app/build/reports/tests/testDebugUnitTest/**
