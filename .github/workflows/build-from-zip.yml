name: Build Route Planner APK v0.7

on:
  workflow_dispatch:
  push:
    paths:
      - "route_planner_android_github_v0.7.zip"
      - ".github/workflows/build-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract project ZIP
        shell: bash
        run: |
          rm -rf project
          mkdir project
          unzip -q route_planner_android_github_v0.7.zip -d project

          SETTINGS="$(find project -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find project -type f -name settings.gradle -print -quit)"
          fi

          test -n "$SETTINGS" || {
            echo "Android Gradle project not found"
            find project -maxdepth 5 -type f | sort | head -200
            exit 1
          }

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Download Tesseract best Russian OCR model
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -L --fail --retry 5 --retry-delay 2 \
            -o app/src/main/assets/tessdata/rus.traineddata \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/4.1.0/rus.traineddata

          SIZE=$(stat -c%s app/src/main/assets/tessdata/rus.traineddata)
          echo "rus.traineddata size: $SIZE bytes"

          if [ "$SIZE" -lt 5000000 ]; then
            echo "OCR model is missing or too small"
            exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          find app/build/outputs/apk/debug -type f -name "*.apk" -print
          test -n "$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: route-planner-v0.7-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
