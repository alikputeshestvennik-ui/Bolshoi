name: Build Route Planner APK

on:
  workflow_dispatch:
  push:
    paths:
      - "route_planner_android_github_v0.2.zip"
      - ".github/workflows/build-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract project ZIP
        shell: bash
        run: |
          rm -rf project
          mkdir project
          unzip -q route_planner_android_github_v0.2.zip -d project

          SETTINGS="$(find project -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find project -type f -name settings.gradle -print -quit)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "Android Gradle project was not found in ZIP."
            find project -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Download Russian OCR model
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -L --fail --retry 3 \
            -o app/src/main/assets/tessdata/rus.traineddata \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/rus.traineddata
          ls -lh app/src/main/assets/tessdata/rus.traineddata

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: route-planner-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
