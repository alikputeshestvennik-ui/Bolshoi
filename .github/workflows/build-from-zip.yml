name: Build Route Planner APK

on:
  workflow_dispatch:
  push:
    paths:
      - "route_planner_android_github_v0.2.zip"
      - ".github/workflows/build-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q route_planner_android_github_v0.2.zip -d project

          # If the ZIP contains one top-level directory, use it as the project root.
          if [ -f "project/gradlew" ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          else
            FOUND="$(find project -maxdepth 3 -type f -name gradlew | head -n 1)"
            if [ -z "$FOUND" ]; then
              echo "gradlew was not found inside the ZIP"
              find project -maxdepth 3 -type f | head -100
              exit 1
            fi
            DIR="$(dirname "$FOUND")"
            echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Download Russian OCR model
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -L --fail \
            -o app/src/main/assets/tessdata/rus.traineddata \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/rus.traineddata

      - name: Make Gradle executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: route-planner-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
