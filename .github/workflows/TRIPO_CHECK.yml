name: Tripo balance check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Balance
        env:
          KEY: ${{ secrets.TRIPO_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "НЕТ СЕКРЕТА TRIPO_API_KEY"; exit 1; fi
          BAL=$(curl -s -H "Authorization: Bearer $KEY" https://openapi.tripo3d.ai/v3/account/balance | tr -d '\n' | head -c 400)
          echo "::notice title=balance::$BAL"
          USE=$(curl -s -H "Authorization: Bearer $KEY" https://openapi.tripo3d.ai/v3/account/usage | tr -d '\n' | head -c 400)
          echo "::notice title=usage::$USE"
