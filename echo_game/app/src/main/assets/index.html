<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07191f"><title>ЭХО · Последний маяк</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="space"></canvas><div class="grain"></div>
<header><div class="brand">◈ <span>Э Х О</span></div><button id="sound" class="icon" aria-label="Включить звук">♫</button><button id="pause" class="icon" aria-label="Пауза" hidden>Ⅱ</button></header>
<div id="hud" hidden><div class="hudrow"><div><small>СЕКТОР</small><b id="wave">01 / 08</b></div><div class="score"><small>СИГНАЛ</small><b id="score">0000</b></div></div><div class="health"><i id="health"></i></div><div class="hudrow mini"><span>ЦЕЛОСТНОСТЬ МАЯКА</span><span id="hp">100%</span></div></div>
<main id="menu" class="screen"><div class="eyebrow">ОДИНОЧНЫЙ ПОЛЁТ / 01</div><h1>Последний<br><em>маяк.</em></h1><p class="intro">Всё погасло.<br>Кроме тебя.</p><div class="orbit-caption">59° N — НЕИЗВЕСТНЫЙ СЕКТОР</div><div class="menu-bottom"><div class="record"><span>ЛУЧШИЙ СИГНАЛ</span><strong id="record">0000</strong></div><button id="start" class="primary">Зажечь свет <span>↗</span></button><button id="how" class="subtle">Как играть <span>＋</span></button><p class="footnote">8 секторов · один маяк · твой свет</p></div></main>
<div id="controls" hidden><div id="hint">Веди корабль пальцем. Он стреляет сам.</div><div class="controlrow"><div class="chargecopy"><small>УДАРНАЯ ВОЛНА</small><b id="charge">ЭХО ГОТОВО</b></div><button id="pulse" aria-label="Выпустить ЭХО">◎<span>ЭХО</span></button></div></div>
<section id="overlay" class="veil" hidden><div class="sheet"><div id="eyebrow" class="eyebrow"></div><h2 id="title"></h2><p id="message"></p><div id="choices"></div><button id="continue" class="primary"></button><button id="home" class="subtle">В главное меню</button></div></section>
<script src="game.js"></script></body></html>
